"238" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#4a4a54"># TODO: move this to env</tspan></text><text x="70" y="264" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">5</text><text x="92" y="264" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">API_KEY</tspan><tspan fill="#f2f2f2"> = </tspan><tspan fill="#a3d9b1">"sk-live-93af"</tspan></text><text x="70" y="290" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">6</text><text x="92" y="290" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"></text><text x="70" y="316" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">7</text><text x="92" y="316" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#c9c9d4">def</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">charge</tspan><tspan fill="#f2f2f2">(</tspan><tspan fill="#f2f2f2">user</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">amount</tspan><tspan fill="#f2f2f2">):</tspan></text><text x="70" y="342" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">8</text><text x="92" y="342" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">try</tspan><tspan fill="#f2f2f2">:</tspan></text><text x="70" y="368" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">9</text><text x="92" y="368" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">        </tspan><tspan fill="#f2f2f2">r</tspan><tspan fill="#f2f2f2"> = </tspan><tspan fill="#f2f2f2">requests</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">post</tspan><tspan fill="#f2f2f2">(</tspan><tspan fill="#f2f2f2">URL</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">json</tspan><tspan fill="#f2f2f2">={</tspan><tspan fill="#a3d9b1">"amt"</tspan><tspan fill="#f2f2f2">: </tspan><tspan fill="#f2f2f2">amount</tspan><tspan fill="#f2f2f2">})</tspan></text><text x="70" y="394" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">10</text><text x="92" y="394" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">except</tspan><tspan fill="#f2f2f2">:</tspan></text><text x="70" y="420" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">11</text><text x="92" y="420" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">        </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">None</tspan></text><text x="70" y="446" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">12</text><text x="92" y="446" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">if</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">r</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">status_code</tspan><tspan fill="#f2f2f2"> == 200:</tspan></text><text x="70" y="472" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">13</text><text x="92" y="472" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">        </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">r</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">json</tspan><tspan fill="#f2f2f2">()</tspan></text><text x="70" y="498" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">14</text><text x="92" y="498" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">None</tspan></text><rect x="724" y="80" width="436" height="780" rx="16" fill="#1c1c21"/><text x="748" y="124" font-size="20" fill="#f2f2f2" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Roast feedback</text><rect x="748" y="150" width="388" height="124" rx="14" fill="#17171a"/><text x="768" y="184" font-size="12" fill="#8a8a93" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">CRITICAL</text><text x="768" y="218" font-size="18" fill="#f2f2f2" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Hardcoded API key</text><text x="768" y="250" font-size="14" fill="#8a8a93" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Move secrets to environment variables.</text><rect x="748" y="300" width="388" height="124" rx="14" fill="#17171a"/><text x="768" y="334" font-size="12" fill="#8a8a93" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">BUG</text><text x="768" y="368" font-size="18" fill="#f2f2f2" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bare except swallows errors</text><text x="768" y="400" font-size="14" fill="#8a8a93" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Catch requests.RequestException instead.</text><rect x="748" y="450" width="388" height="124" rx="14" fill="#17171a"/><text x=