<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><rect width="1200" height="900" fill="#0f0f10"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#141417"/><circle cx="24" cy="24" r="6" fill="#4a4a54"/><circle cx="42" cy="24" r="6" fill="#4a4a54"/><circle cx="60" cy="24" r="6" fill="#4a4a54"/><rect x="420" y="12" width="360" height="24" rx="12" fill="#17171a"/><text x="600" y="29" font-size="12" fill="#8a8a93" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">app.whatsapp-bot/flows</text><rect x="40" y="80" width="660" height="780" rx="16" fill="#1c1c21"/><rect x="56" y="96" width="220" height="36" rx="10" fill="#17171a"/><text x="72" y="120" font-size="14" fill="#f2f2f2" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">flows.py</text><text x="70" y="160" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">1</text><text x="92" y="160" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">FAQ</tspan><tspan fill="#f2f2f2"> = {</tspan><tspan fill="#a3d9b1">"hours"</tspan><tspan fill="#f2f2f2">: </tspan><tspan fill="#a3d9b1">"Mon-Fri 9-18"</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#a3d9b1">"delivery"</tspan><tspan fill="#f2f2f2">: </tspan><tspan fill="#a3d9b1">"2-3 days"</tspan><tspan fill="#f2f2f2">}</tspan></text><text x="70" y="186" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">2</text><text x="92" y="186" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"></text><text x="70" y="212" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">3</text><text x="92" y="212" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#c9c9d4">def</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">reply</tspan><tspan fill="#f2f2f2">(</tspan><tspan fill="#f2f2f2">message</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">lead</tspan><tspan fill="#f2f2f2">):</tspan></text><text x="70" y="238" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">4</text><text x="92" y="238" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#f2f2f2">text</tspan><tspan fill="#f2f2f2"> = </tspan><tspan fill="#f2f2f2">message</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">lower</tspan><tspan fill="#f2f2f2">()</tspan></text><text x="70" y="264" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">5</text><text x="92" y="264" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">if</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#a3d9b1">"human"</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">in</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">text</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">or</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">lead</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">frustrated</tspan><tspan fill="#f2f2f2">:</tspan></text><text x="70" y="290" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">6</text><text x="92" y="290" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">        </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">handoff</tspan><tspan fill="#f2f2f2">(</tspan><tspan fill="#f2f2f2">lead</tspan><tspan fill="#f2f2f2">)</tspan></text><text x="70" y="316" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">7</text><text x="92" y="316" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">for</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">key</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">answer</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">in</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">FAQ</tspan><tspan fill="#f2f2f2">.</tspan><tspan fill="#f2f2f2">items</tspan><tspan fill="#f2f2f2">():</tspan></text><text x="70" y="342" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">8</text><text x="92" y="342" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">        </tspan><tspan fill="#c9c9d4">if</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">key</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">in</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">text</tspan><tspan fill="#f2f2f2">:</tspan></text><text x="70" y="368" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">9</text><text x="92" y="368" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">            </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#f2f2f2">answer</tspan></text><text x="70" y="394" font-size="14" fill="#4a4a54" font-weight="400" text-anchor="end" font-family="Consolas, Menlo, monospace">10</text><text x="92" y="394" font-size="15" font-family="Consolas, Menlo, monospace" style="white-space:pre" fill="#f2f2f2"><tspan fill="#f2f2f2">    </tspan><tspan fill="#c9c9d4">return</tspan><tspan fill="#f2f2f2"> </tspan><tspan fill="#c9c9d4">None</tspan></text><rect x="724" y="80" width="436" height="780" rx="16" fill="#1c1c21"/><text x="748" y="124" font-size="20" fill="#f2f2f2" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Handoff rules</text><rect x="748" y="150" width="388" height="124" rx="14" fill="#17171a"/><text x="768" y="184" font-size="12" fill="#8a8a93" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">RULE</text><text x="768" y="218" font-size="18" fill="#f2f2f2" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Escalate on "human"</text><text x="768" y="250" font-size="14" fill="#8a8a93" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Any request for a person goes to the queue.</text><rect x="748" y="300" width="388" height="124" rx="14" fill="#17171a"/><text x="768" y="334" font-size="12" fill="#8a8a93" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">RULE</text><text x="768" y="368" font-size="18" fill="#f2f2f2" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Frustration score</text><text x="768" y="400" font-size="14" fill="#8a8a93" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two negative messages trigger handoff.</text><rect x="748" y="450" width="388" height="124" rx="14" fill="#17171a"/><text x="768" y="484" font-size="12" fill="#8a8a93" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">RULE</text><text x="768" y="518" font-size="18" fill="#f2f2f2" font-weight="600" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Fallback message</text><text x="768" y="550" font-size="14" fill="#8a8a93" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Unknown intents get a polite default reply.</text></svg>